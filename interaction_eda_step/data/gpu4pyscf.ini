# How to run GPU4PySCF for the Interaction EDA step.
#
# GPU4PySCF lives in its own Python environment (GPU4PySCF 1.9 or later, with
# cupy, cutensor and pyscf-dispersion), which needs a GPU with good double
# precision: A100, A30, H100/H200 or B200, not L40S or T4.
#
# Each section is for one executor ('local' runs on this machine). 'code' is the
# Python of that environment; the step runs its driver script with it.

[local]
installation = local
code = python
