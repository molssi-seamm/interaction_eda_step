# How to run GPU4PySCF for the Interaction EDA step.
#
# GPU4PySCF lives in its own Python environment (GPU4PySCF 1.9.1 or later, with
# CuPy, cuTENSOR and pyscf-dispersion) and needs Linux and an NVIDIA GPU with good
# double precision: A100, A30, H100/H200 or B200, not L40S or T4.
#
# Each section is for one executor ('local' runs on this machine).

[local]
# The type of installation. Options are:
#     conda: the Conda environment below, which interaction-eda-step-installer
#            creates and fills (the default)
#     local: 'code' is the full path to the Python of an environment you made

installation = conda

# For a conda installation, the conda executable and the environment.

# conda = /path/to/conda
conda-environment = seamm-gpu4pyscf

# The Python that runs the step's driver script: 'python' in the Conda
# environment, or e.g. /home/me/envs/gpu4pyscf/bin/python for a local one.

code = python

# Which CUDA build of GPU4PySCF the installer puts in the environment. 'auto'
# reads the NVIDIA driver with nvidia-smi and uses the CUDA 12 build (the
# validated one, which also runs with CUDA 13 drivers); with no driver, as on a
# cluster login node, it also uses the CUDA 12 build. Set cuda12x or cuda13x to
# force one.

cuda-build = auto
